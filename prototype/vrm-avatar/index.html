<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VRM Avatar Prototype</title>
  <style>
    html, body { margin: 0; height: 100%; background: #202024; }
    #app { position: fixed; inset: 0; }
    #overlay {
      position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
      color: #eee; font: 13px/1.4 system-ui, sans-serif; background: rgba(0,0,0,.55);
      padding: 4px 12px; border-radius: 8px; pointer-events: none;
    }
    #err {
      position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
      color: #ff5b5b; font: 13px/1.5 monospace; white-space: pre-wrap;
      max-width: 80%; text-align: center;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/",
        "@pixiv/three-vrm": "./vendor/three-vrm.module.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="overlay">loading…</div>
  <div id="err" hidden></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
