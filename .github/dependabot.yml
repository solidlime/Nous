version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # mypy/mypy-baseline: exact-pinned; a bump changes what baseline entries mean
      # until mypy-baseline.txt is regenerated. ruff/bandit: exact-pinned; a bump
      # changes lint findings faster than we chase. Auto-bumps would turn CI red.
      - dependency-name: "mypy"
      - dependency-name: "mypy-baseline"
      - dependency-name: "ruff"
      - dependency-name: "bandit"

  - package-ecosystem: "npm"
    directory: "/nous/api/http/static"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
