# CI: PR checks — lint + unit tests
# Runs on push to main and on every PR.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------------
  # Lint: ruff check + ruff format check
  # ------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools (pinned via requirements-dev.txt)
        run: pip install -r requirements-dev.txt

      # ruff check — lint rules (E, F, W, I, N, UP, B, A, SIM, TCH)
      - name: Run ruff check
        run: ruff check .

      # ruff format — formatting compliance (dry-run)
      - name: Run ruff format check
        run: ruff format --check .

  # ------------------------------------------------------------------
  # Test: unit tests with pytest
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install both prod and dev dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements-prod.txt -r requirements-dev.txt

      # Qdrant client is needed even for unit tests (some fixtures import it)
      # Unit tests should not require a running Qdrant instance
      - name: Run unit tests
        run: pytest tests/unit/ -q --timeout=60

  # ------------------------------------------------------------------
  # Typecheck: mypy static analysis
  # ------------------------------------------------------------------
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-prod.txt -r requirements-dev.txt

      - name: Run mypy (delta-gated against mypy-baseline.txt)
        shell: bash
        # GH Actions forces `-eo pipefail` on bash, so pipelines would propagate
        # mypy's exit 1 (baseline errors) even when filter reports new=0.
        # Route output through a file; the gate is filter's exit code (new errors only).
        run: |
          mypy nous/ > /tmp/mypy_out.txt || true
          mypy-baseline filter < /tmp/mypy_out.txt

  # ------------------------------------------------------------------
  # Integration tests: ASGI transport based integration tests
  # ------------------------------------------------------------------
  integration:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-prod.txt -r requirements-dev.txt

      - name: Run integration tests
        run: pytest tests/integration/ -q --timeout=60

  # ------------------------------------------------------------------
  # Coverage: test coverage with threshold enforcement
  # ------------------------------------------------------------------
  coverage:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-prod.txt -r requirements-dev.txt

      - name: Run coverage
        # tests/contracts requires the optional [contract] extra (pact-python), not installed here
        run: pytest --cov=nous --cov-fail-under=70 --cov-report=term --ignore=tests/contracts

  # ------------------------------------------------------------------
  # Contract: Pact consumer tests (needs [contract] extra, no server required)
  # Provider verification (tests/contracts/provider) needs a running server
  # (NOUS_PROVIDER_URL) and stays manual — see tests/contracts/provider/.
  # ------------------------------------------------------------------
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies with contract extra
        run: |
          pip install -r requirements-prod.txt -r requirements-dev.txt
          pip install ".[contract]"

      - name: Run consumer contract tests
        run: pytest tests/contracts/consumer -q --timeout=60

  # ------------------------------------------------------------------
  # Frontend: vitest + JS syntax lint (stylelint runs via lint:css locally;
  # npm audit is report-only - devDependency advisories tracked via dependabot)
  # ------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nous/api/http/static/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix nous/api/http/static

      - name: Run vitest
        run: npm test --prefix nous/api/http/static

      - name: Run JS lint
        run: npm run lint:js --prefix nous/api/http/static

      - name: npm audit (report-only)
        run: npm audit --prefix nous/api/http/static --audit-level=moderate
        continue-on-error: true

  # ------------------------------------------------------------------
  # Security: bandit static analysis
  # ------------------------------------------------------------------
  # -ll gates on MEDIUM+: LOW findings are tracked via the local
  # bandit_report.json artifact (gitignored) and dependabot, not the gate.
  # Known B608 placeholders are marked # nosec at the call site.
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools (pinned via requirements-dev.txt)
        run: pip install -r requirements-dev.txt

      - name: Run bandit
        run: bandit -r nous/ -ll
