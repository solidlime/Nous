# CI: PR checks — lint + unit tests
# Runs on push to main and on every PR.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------------
  # Lint: ruff check + ruff format check
  # ------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # ruff check — lint rules (E, F, W, I, N, UP, B, A, SIM, TCH)
      - name: Run ruff check
        run: ruff check .

      # ruff format — formatting compliance (dry-run)
      - name: Run ruff format check
        run: ruff format --check .

  # ------------------------------------------------------------------
  # Test: unit tests with pytest
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install both prod and dev dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements-prod.txt -r requirements-dev.txt

      # Qdrant client is needed even for unit tests (some fixtures import it)
      # Unit tests should not require a running Qdrant instance
      - name: Run unit tests
        run: pytest tests/unit/ -q --timeout=60

  # ------------------------------------------------------------------
  # Typecheck: mypy static analysis
  # ------------------------------------------------------------------
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-prod.txt -r requirements-dev.txt

      - name: Run mypy
        run: mypy nous/

  # ------------------------------------------------------------------
  # Integration tests: ASGI transport based integration tests
  # ------------------------------------------------------------------
  integration:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-prod.txt -r requirements-dev.txt

      - name: Run integration tests
        run: pytest tests/integration/ -q --timeout=60

  # ------------------------------------------------------------------
  # Coverage: test coverage with threshold enforcement
  # ------------------------------------------------------------------
  coverage:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-prod.txt -r requirements-dev.txt

      - name: Run coverage
        run: pytest --cov=nous --cov-fail-under=70 --cov-report=term

  # ------------------------------------------------------------------
  # Security: bandit static analysis
  # ------------------------------------------------------------------
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -r nous/ -ll
