# CI: PR checks — lint + unit tests
# Runs on push to main and on every PR.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------------
  # Lint: ruff check + ruff format check
  # ------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # setup-python が置いた 3.12 を使う（managed python の DL を防ぐ）
          python-preference: only-system

      # pyproject.toml と uv.lock の乖離を機械検�出（sync 前に落とす）
      - name: Check uv.lock is up to date
        run: uv lock --check

      # pyproject.toml [project] + [dependency-groups] dev から同期
      # （CI とローカルで同じコマンド: uv sync --all-extras）
      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      # ruff check — lint rules (E, F, W, I, N, UP, B, A, SIM, TCH)
      - name: Run ruff check
        run: uv run ruff check .

      # ruff format — formatting compliance (dry-run)
      - name: Run ruff format check
        run: uv run ruff format --check .

  # ------------------------------------------------------------------
  # Test: unit tests with pytest
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-preference: only-system

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      # Qdrant client is needed even for unit tests (some fixtures import it)
      # Unit tests should not require a running Qdrant instance
      - name: Run unit tests
        run: uv run pytest tests/unit/ -q --timeout=60

  # ------------------------------------------------------------------
  # Typecheck: mypy static analysis
  # ------------------------------------------------------------------
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-preference: only-system

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Run mypy (delta-gated against mypy-baseline.txt)
        run: make typecheck

  # ------------------------------------------------------------------
  # Integration tests: ASGI transport based integration tests
  # ------------------------------------------------------------------
  integration:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-preference: only-system

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Run integration tests
        run: uv run pytest tests/integration/ -q --timeout=60

  # ------------------------------------------------------------------
  # Coverage: test coverage with threshold enforcement
  # ------------------------------------------------------------------
  coverage:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-preference: only-system

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Run coverage
        # tests/contracts runs in the dedicated contract job (--all-extras incl. pact-python);
        # skipped here to keep this job's runtime and coverage surface focused
        run: uv run pytest --cov=nous --cov-fail-under=70 --cov-report=term --ignore=tests/contracts

  # ------------------------------------------------------------------
  # Contract: Pact consumer tests (needs [contract] extra, no server required)
  # Provider verification (tests/contracts/provider) needs a running server
  # (NOUS_PROVIDER_URL) and stays manual — see tests/contracts/provider/.
  # ------------------------------------------------------------------
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-preference: only-system

      # --all-extras で [contract] extra も入る — ローカルと同コマンド
      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Run consumer contract tests
        run: uv run pytest tests/contracts/consumer -q --timeout=60

  # ------------------------------------------------------------------
  # Frontend: vitest + JS syntax lint (stylelint runs via lint:css locally;
  # npm audit is report-only - devDependency advisories tracked via dependabot)
  # ------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nous/api/http/static/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix nous/api/http/static

      - name: Run vitest
        run: npm test --prefix nous/api/http/static

      - name: Check generated shell.js is fresh
        # shell.js は scripts/build-css.mjs の生成物 — ソース（core/sse.js 等）を
        # 編集して再生を忘れると「本番は旧エンジンのまま、テストは新コード」
        # という検証と実装の乘離が起きる（2026-11-22 事故）。
        run: node scripts/build-css.mjs --check

      - name: Run JS lint
        run: npm run lint:js --prefix nous/api/http/static

      - name: npm audit (report-only)
        run: npm audit --prefix nous/api/http/static --audit-level=moderate
        continue-on-error: true

  # ------------------------------------------------------------------
  # Security: bandit static analysis
  # ------------------------------------------------------------------
  # -ll gates on MEDIUM+: LOW findings are tracked via the local
  # bandit_report.json artifact (gitignored) and dependabot, not the gate.
  # Known B608 placeholders are marked # nosec at the call site.
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-preference: only-system

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Run bandit
        run: uv run bandit -r nous/ -ll

  # ------------------------------------------------------------------
  # Search quality smoke: fixed small corpus + threshold gate on the
  # offline keyword path (no Qdrant / embedding model). Artifacts are
  # kept so a regression can be diffed against the previous run.
  # ------------------------------------------------------------------
  search-quality:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-preference: only-system

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Run search quality smoke (offline keyword path)
        run: uv run python scripts/search_quality_smoke.py --out output/search_quality_smoke

      - name: Upload search quality artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-quality-smoke
          path: output/search_quality_smoke.*
          retention-days: 14
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Docs drift: MCP tool list / HTTP endpoints / settings env keys must
  # match the implementation. Known-undocumented endpoints live in
  # scripts/docs_drift_baseline.json; regenerate with --write-baseline.
  # ------------------------------------------------------------------
  docs-drift:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-preference: only-system

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Check docs/implementation drift
        run: uv run python scripts/check_docs_drift.py
