[project]
name = "nous"
version = "3.5.0"
description = "Persistent memory server for LLM agents via MCP"
requires-python = ">=3.12"
dependencies = [
    "PyMuPDF>=1.24.0",
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.13",
    "sudachipy>=0.6.0",
    "sudachidict_core>=20240716",
    "fastmcp>=3.4.4",
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
    "aiosqlite>=0.22.1",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.13",
    "pdfplumber>=0.11.0",
]
contract = [
    "pact-python>=3.4.0,<4.0",
    "requests>=2.31.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
# Markdown specs/plans are prose documents; don't machine-format their code blocks.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:Use 'streamable_http_client' instead:DeprecationWarning",
    "ignore:Using 'httpx' with 'starlette.testclient' is deprecated:DeprecationWarning",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires DB)",
    "slow: Slow tests (embedding model loading etc)",
    "benchmark: Performance benchmark tests",
    "ui: Visual regression tests (requires running server & Playwright)",
    "contract: Contract tests using Pact (consumer-driven contract testing)",
    "provider_verify: Provider verification tests (requires running server)",
]

[tool.coverage.run]
source = ["nous"]
omit = ["tests/*", "*/migration/*"]

[tool.mypy-baseline]
baseline_path = "mypy-baseline.txt"

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
exclude = ["tests/", "migrations/"]
