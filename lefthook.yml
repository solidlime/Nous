pre-commit:
  commands:
    ruff-format:
      glob:
        - "nous/**/*.py"
        - "tests/**/*.py"
      run: uv run ruff format nous/ tests/
    ruff-check:
      glob:
        - "nous/**/*.py"
        - "tests/**/*.py"
      run: uv run ruff check nous/ tests/
    mypy:
      glob:
        - "nous/**/*.py"
      run: make typecheck
