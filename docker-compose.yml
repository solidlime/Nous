# DATA_ROOT → ホスト側パス（.env.example 参照）。コンテナ側 /data（= NOUS_DATA_ROOT）にマウントされる。
# qdrant と mcp-hub は NAS 上の既存パスを使う（このスタックは NAS 専用の運用）。
# 構成を変えるときは Portainer のスタックと必ず同時に直すこと（片方だけ直すとデータの在り処がずれる）。

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - /volume1/docker/qdrant:/qdrant/storage
    networks:
      - nous-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nous:
    image: ghcr.io/solidlime/nous:latest
    container_name: nous
    ports:
      - "26262:26262"
    volumes:
      # Nous アプリデータ永続化（persona, cache, sudachi, config, skills）
      - ${DATA_ROOT}/data:/data
    networks:
      - nous-net
    restart: unless-stopped
    # ペルソナ設定の base_url は http://nas:4000/v1（LiteLLM）を指す。compose ネットワークの
    # DNS はコンテナ名しか解かないので、NAS 自身を指すエイリアスを here で供給する。
    # 無いと LLM 呼び出しが全部「Connection error.」で無言に終わる（2026-11-17）。
    extra_hosts:
      - "nas:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      NOUS_QDRANT__URL: http://qdrant:6333
      LANG: C.UTF-8
      # ドリーミング（wiki 編纂・日記・明日の予定生成）。既定は settings 側で false なので、
      # ここで渡さないと worker は「started」と出したまま毎回無言で早期 return する（#63）。
      NOUS_WIKI__ENABLED: ${NOUS_WIKI__ENABLED:-true}
      # sandbox ツール: manager の URL とトークンは compose から渡す（config.json に書かなくてよい）
      NOUS_SANDBOX_ENABLED: ${NOUS_SANDBOX_ENABLED:-true}
      NOUS_SANDBOX_MANAGER_URL: http://nous-sandbox-manager:8080
      NOUS_SANDBOX_MANAGER_TOKEN: ${NOUS_SANDBOX_MANAGER_TOKEN:?set NOUS_SANDBOX_MANAGER_TOKEN}
      NOUS_TIMEZONE: ${NOUS_TIMEZONE:-Asia/Tokyo}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:26262/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # MCP の集約ハブ。nous と同じスタックに居る（container 名 nous-mcp-hub-1）。
  mcp-hub:
    image: ghcr.io/solidlime/mcp-hub:latest
    restart: unless-stopped
    ports:
      - "26263:26263"
    networks:
      - nous-net
    environment:
      - MCP_HUB_DATA_DIR=/home/mcp-hub/data
    volumes:
      - /volume1/docker/mcp-hub:/home/mcp-hub
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:26263/admin/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # sandbox コンテナの Manager。docker.sock を持つのはこのプロセスだけ。
  # ペルソナは DB で増減するのでサービスに固定せず、docker run で動的生成する。
  sandbox-manager:
    image: ghcr.io/solidlime/nous:latest
    container_name: nous-sandbox-manager
    command: ["python", "-m", "nous.services.sandbox_manager"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT}/data:/data
    networks:
      - nous-net
    restart: unless-stopped
    stop_grace_period: 30s
    # sock を持つプロセスなので、nous 本体より権限を絞る
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    environment:
      NOUS_DATA_ROOT: /data
      NOUS_SANDBOX_MANAGER_TOKEN: ${NOUS_SANDBOX_MANAGER_TOKEN:?set NOUS_SANDBOX_MANAGER_TOKEN}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-ubuntu:24.04}
      # sandbox を user-defined network に載せると Docker の埋め込み DNS で nous が引ける。
      # 既定 bridge では引けない（外部 egress は通るので「静かに壊れる」）。
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-nous-net}
      # 上の SANDBOX_NETWORK を許可リストに足す。_DEFAULT_NETWORKS は none / bridge だけ。
      SANDBOX_ALLOWED_NETWORKS: ${SANDBOX_ALLOWED_NETWORKS:-nous-net}
      # sandbox の TZ。Nous 設定（NOUS_TIMEZONE）を manager 経由で引き継ぐ。
      # SANDBOX_TZ で個別上書きできる。
      NOUS_TIMEZONE: ${NOUS_TIMEZONE:-Asia/Tokyo}
      # manager 自身のプロセス TZ（logger 用）。sandbox への伝達は NOUS_TIMEZONE 側。
      TZ: ${TZ:-Asia/Tokyo}
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-4g}
      # 焼かずに起動時に dpkg -s で差分だけ apt install するパッケージ（カンマ区切り）
      SANDBOX_APT_EXTRA: ${SANDBOX_APT_EXTRA:-}
      SANDBOX_IDLE_MINUTES: ${SANDBOX_IDLE_MINUTES:-30}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# sandbox を載せる user-defined network。既定 bridge には Docker の埋め込み DNS
# （127.0.0.11）が無いので、`getent hosts nous` が引けずに静かに壊れる。
# ここに参加させるのは名前で引かれているサービスだけ（qdrant も http://qdrant:6333 で引く）。
# 公開ポートはそのまま（ports は network と無関係）。
# name を明示するのは、スタック名のプレフィックス（nous_nous-net）で作られると
# sandbox_manager の `docker run --network nous-net` が見つけられないため。
networks:
  nous-net:
    name: nous-net
    driver: bridge
