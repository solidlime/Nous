# DATA_ROOT → ホスト側パス（.env.example 参照）。コンテナ側 /opt/nous（= NOUS_DATA_ROOT）にマウントされる。

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Persist Qdrant vector data on host (ensures ./storage is always pre-created)
      - ${DATA_ROOT}/qdrant:/qdrant/storage
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nous:
    image: ghcr.io/solidlime/nous:latest
    container_name: nous
    ports:
      - "26262:26262"
    volumes:
      # Nous アプリデータ永続化（persona, cache, sudachi, config, skills）
      # DATA_ROOT（ホスト） → /data（コンテナ、=NOUS_DATA_ROOT）
      - ${DATA_ROOT}:/data
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      # Point to the qdrant service (overrides Dockerfile default of localhost:6333)
      NOUS_QDRANT__URL: http://qdrant:6333
      LANG: C.UTF-8
    # Load env vars from .env file (ignored by git) so you can override Dockerfile defaults
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:26262/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # sandbox コンテナの Manager。docker.sock を持つのはこのプロセスだけ。
  # ペルソナは DB で増減するのでサービスに固定せず、docker run で動的生成する。
  sandbox-manager:
    image: ghcr.io/solidlime/nous:latest
    container_name: nous-sandbox-manager
    command: ["python", "-m", "nous.services.sandbox_manager"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # sandbox の /home/<persona>/workspace はここに置く
      - ${DATA_ROOT}:/data
    restart: unless-stopped
    # sock を持つプロセスなので、nous 本体より権限を絞る
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    # API キーは渡さない（sock を持つ側に秘密を持たせない）。SANDBOX_* だけで足りる。
    environment:
      NOUS_DATA_ROOT: /data
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-ubuntu:24.04}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-bridge}
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-4g}
      SANDBOX_IDLE_MINUTES: ${SANDBOX_IDLE_MINUTES:-30}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

