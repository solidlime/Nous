# DATA_ROOT → ホスト側パス（.env.example 参照）。コンテナ側は NOUS_DATA_ROOT (/opt/nous/data) で固定。

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Persist Qdrant vector data on host (ensures ./storage is always pre-created)
      - ${DATA_ROOT}/qdrant:/qdrant/storage
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mcp-hub:
    image: ghcr.io/solidlime/mcp-hub:latest
    container_name: mcp-hub
    # root で実行: バインドマウントの /opt/mcp-hub/data がホスト側 root 所有のため
    user: "0:0"
    ports:
      - "26263:26263"
    volumes:
      # MCP Hub データ永続化（サーバー登録情報）
      - ${DATA_ROOT}/mcp-hub:/opt/mcp-hub/data
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_HUB_PORT: "26263"
      MCP_HUB_HOST: "0.0.0.0"
      MCP_HUB_DB_PATH: /opt/mcp-hub/data/hub.db
      # Brave Search API キー (オプション)
      # BRAVE_API_KEY: your-key-here
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:26263/admin/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nous:
    image: ghcr.io/solidlime/nous:latest
    container_name: nous
    ports:
      - "26262:26262"
    volumes:
      # Nous アプリデータ永続化（memory, logs, cache, config, skills）
      # DATA_ROOT/app（ホスト） → /opt/nous/data（コンテナ、=NOUS_DATA_ROOT）
      - ${DATA_ROOT}/app:/opt/nous/data
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      # Point to the qdrant service (overrides Dockerfile default of localhost:6333)
      NOUS_QDRANT__URL: http://qdrant:6333
      # MCP Hub プロキシエンドポイント（チャットUIでMCPサーバーとして登録可能）
      NOUS_MCP_HUB_URL: http://mcp-hub:26263/mcp
      LANG: C.UTF-8
    # Load env vars from .env file (ignored by git) so you can override Dockerfile defaults
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:26262/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s


